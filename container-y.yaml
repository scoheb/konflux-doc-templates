---
vars: |
  {%- set product_version_str = advisory.spec.product_version | string() %}
  {%- set rhel_major_version = product_version_str.split('.')[0] %} 
  {%- set rhel_minor_version = product_version_str.split('.')[:2] | join('.') %}
synopsis: |
  {%- if advisory.spec.type == "RHSA" %}
  {{ advisory.spec.severity }}: Application Stream container images security update
  {%- else %}
  Application Stream container images bug fix and enhancement update
  {%- endif %}
topic: |
  Updated Application Stream container images for {{ advisory.spec.product_name }} are now available in the Red Hat container registry.

  {%- if advisory.spec.type == "RHSA" %}
  Red Hat Product Security has rated this update as having a security impact of {{ advisory.spec.severity }}. 
  A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.
  {%- endif %}
description: |
  Red Hat Enterprise Linux {{ rhel_major_version }} Application Stream container images are based on the corresponding
  Application Stream component and the ubi{{ rhel_major_version }} or rhel{{ rhel_major_version }} base image.

  The rhel{{ rhel_major_version }} and ubi{{ rhel_major_version }} base images have been updated to the latest version.
  For detailed information about the updated images, see the Updated Images tab.

  To pull a container image, run one of the following commands as root based on the <image_name>:

  podman pull registry.redhat.io/<image_name> (authenticated, rhel images)  
  podman pull registry.access.redhat.com/<image_name> (unauthenticated, ubi images)

  {%- if advisory.spec.type == 'RHSA' %}        
  For detailed information about the security updates, see the Fixes and CVEs sections.

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  Additional Changes:

  For detailed information on changes in this release, see the Red Hat Enterprise Linux {{ rhel_minor_version }} Release Notes linked from the References section.

  {%- else %}
  For detailed information about bug fix and enhancement updates, see the Fixes section.
  {%- endif %}
solution: |
  The container images provided by this update can be downloaded from the Red Hat container registry
  at registry.redhat.io using the "podman pull" command. For more information about the image,
  search the <image_name> in the Red Hat Ecosystem Catalog: https://catalog.redhat.com/software/containers/search.

references: |
  https://catalog.redhat.com/software/containers/search
  {%- if advisory.spec.type == "RHSA" %}
  https://access.redhat.com/security/updates/classification/#{{ advisory.spec.severity }}
  {%- endif %}
  docs.redhat.com/en/documentation/red_hat_enterprise_linux/{{ rhel_major_version }}/html/{{ rhel_minor_version }}_release_notes/index
